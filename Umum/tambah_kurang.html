<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Matematika Interaktif Anak</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 { color: #2d3436; font-size: 24px; margin-bottom: 10px; }
        p { color: #636e72; }
        .form-group {
            margin: 15px 0;
            text-align: left;
        }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #2d3436; }
        select, input {
            width: 100%;
            padding: 10px;
            border: 2px solid #dfe6e9;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #00b894;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 15px;
            transition: 0.2s;
        }
        button:hover { background-color: #00a884; }
        .question-box {
            font-size: 36px;
            font-weight: bold;
            color: #2d3436;
            margin: 20px 0;
        }
        .timer {
            font-size: 18px;
            color: #e17055;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .feedback {
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0;
            min-height: 24px;
        }
        .correct { color: #00b894; }
        .wrong { color: #d63031; }
        .hidden { display: none; }
        .score-box { font-size: 20px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="card">
    <!-- MENU UTAMA -->
    <div id="setup-screen">
        <h1>✨ Kuis Matematika Seru ✨</h1>
        <p>Latihan Penjumlahan & Pengurangan</p>
        
        <div class="form-group">
            <label>Pilih Level Anak:</label>
            <select id="level">
                <option value="1">Kelas 1 SD (Angka lebih sederhana)</option>
                <option value="3">Kelas 3 SD (Lebih menantang)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Jumlah Soal:</label>
            <select id="total-questions">
                <option value="5">5 Soal</option>
                <option value="10" selected>10 Soal</option>
                <option value="15">15 Soal</option>
            </select>
        </div>

        <div class="form-group">
            <label>Gunakan Waktu (Timer):</label>
            <select id="use-timer">
                <option value="yes">Ya (10 detik per soal)</option>
                <option value="no">Tidak (Santai)</option>
            </select>
        </div>

        <button onclick="startQuiz()">Mulai Kuis 🚀</button>
    </div>

    <!-- LAYAR KUIS -->
    <div id="quiz-screen" class="hidden">
        <div id="timer-display" class="timer">Waktu: <span id="time-left">10</span>s</div>
        <p>Soal <span id="current-q">1</span> dari <span id="total-q">10</span></p>
        
        <div class="question-box" id="question-text">5 + 3 = ?</div>

        <input type="number" id="user-answer" placeholder="Ketik jawaban..." autofocus onkeypress="checkEnter(event)">
        <button onclick="submitAnswer()">Jawab 💡</button>
        
        <div class="feedback" id="feedback"></div>
    </div>

    <!-- LAYAR SELESAI -->
    <div id="result-screen" class="hidden">
        <h1>🎉 Hore! Selesai! 🎉</h1>
        <div class="score-box" id="score-result"></div>
        <button onclick="resetQuiz()">Main Lagi 🔄</button>
    </div>
</div>

<script>
    let config = { level: 1, total: 10, timer: 'yes' };
    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let timerInterval;
    let timeLeft = 10;

    function startQuiz() {
        config.level = document.getElementById('level').value;
        config.total = parseInt(document.getElementById('total-questions').value);
        config.timer = document.getElementById('use-timer').value;

        generateQuestions();
        currentIndex = 0;
        score = 0;

        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        if (config.timer === 'no') {
            document.getElementById('timer-display').classList.add('hidden');
        } else {
            document.getElementById('timer-display').classList.remove('hidden');
        }

        loadQuestion();
    }

    function generateQuestions() {
        questions = [];
        for (let i = 0; i < config.total; i++) {
            let isAdd = Math.random() < 0.5; // 50% penjumlahan, 50% pengurangan
            let num1, num2, ans;

            if (isAdd) {
                // Penjumlahan: 1 digit (0-9), total maksimal 20
                num1 = Math.floor(Math.random() * 10);
                let maxNum2 = 20 - num1;
                num2 = Math.floor(Math.random() * (maxNum2 + 1));
                ans = num1 + num2;
                questions.push({ q: `${num1} + ${num2} = ?`, a: ans });
            } else {
                // Pengurangan: yang dikurangi maksimal 20
                num1 = Math.floor(Math.random() * 21); // 0 sampai 20
                num2 = Math.floor(Math.random() * (num1 + 1)); // pengurang tidak boleh lebih besar dari num1
                ans = num1 - num2;
                questions.push({ q: `${num1} - ${num2} = ?`, a: ans });
            }
        }
    }

    function loadQuestion() {
        if (currentIndex >= questions.length) {
            endQuiz();
            return;
        }

        document.getElementById('current-q').innerText = currentIndex + 1;
        document.getElementById('total-q').innerText = config.total;
        document.getElementById('question-text').innerText = questions[currentIndex].q;
        document.getElementById('user-answer').value = '';
        document.getElementById('feedback').innerText = '';

        if (config.timer === 'yes') {
            clearInterval(timerInterval);
            timeLeft = config.level == 3 ? 8 : 12; // Kelas 3 waktu lebih cepat dikit
            document.getElementById('time-left').innerText = timeLeft;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time-left').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleWrongTimeOut();
                }
            }, 1000);
        }
    }

    function checkEnter(event) {
        if (event.key === 'Enter') {
            submitAnswer();
        }
    }

    function submitAnswer() {
        if (config.timer === 'yes') clearInterval(timerInterval);

        let userAns = parseInt(document.getElementById('user-answer').value);
        let correctAns = questions[currentIndex].a;
        let feedbackEl = document.getElementById('feedback');

        if (isNaN(userAns)) {
            feedbackEl.innerText = "Masukkan angka dulu ya!";
            feedbackEl.className = "feedback wrong";
            if (config.timer === 'yes') startTimerAgain();
            return;
        }

        if (userAns === correctAns) {
            score++;
            feedbackEl.innerText = "Benar! Hebat sekali! 👍";
            feedbackEl.className = "feedback correct";
        } else {
            feedbackEl.innerText = `Kurang tepat. Jawabannya adalah ${correctAns}`;
            feedbackEl.className = "feedback wrong";
        }

        currentIndex++;
        setTimeout(loadQuestion, 1500); // Jeda 1.5 detik sebelum soal berikutnya
    }

    function handleWrongTimeOut() {
        let correctAns = questions[currentIndex].a;
        let feedbackEl = document.getElementById('feedback');
        feedbackEl.innerText = `Waktu habis! Jawabannya adalah ${correctAns}`;
        feedbackEl.className = "feedback wrong";

        currentIndex++;
        setTimeout(loadQuestion, 1500);
    }

    function startTimerAgain() {
        if (config.timer === 'yes') {
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time-left').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleWrongTimeOut();
                }
            }, 1000);
        }
    }

    function endQuiz() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        
        let message = "";
        let percentage = (score / config.total) * 100;
        if (percentage === 100) message = "Luar Biasa! Pintar Banget! 🌟🌟🌟";
        else if (percentage >= 70) message = "Bagus Sekali! Pertahankan! 👏";
        else message = "Tetap Semangat Belajar Ya! 💪";

        document.getElementById('score-result').innerHTML = `
            Skor Kamu: <b>${score}</b> dari ${config.total}<br>
            ${message}
        `;
    }

    function resetQuiz() {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('setup-screen').classList.remove('hidden');
    }
</script>

</body>
</html>
