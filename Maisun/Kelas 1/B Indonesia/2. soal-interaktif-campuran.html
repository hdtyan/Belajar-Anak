<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayo Berlatih - Kuis Bahasa Indonesia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC;
    --paper-deep:#F1E6C9;
    --ink:#233D4D;
    --teal:#2F9C95;
    --marigold:#F2A541;
    --burnt:#E4572E;
    --leaf:#6A994E;
    --white:#FFFFFF;
    --shadow: 0 8px 0 rgba(35,61,77,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 8% 8%, #fff 0 2.4%, transparent 3%),
      radial-gradient(circle at 92% 14%, #fff 0 2%, transparent 2.6%),
      radial-gradient(circle at 84% 88%, #fff 0 2.2%, transparent 2.8%),
      radial-gradient(circle at 6% 80%, #fff 0 1.8%, transparent 2.3%),
      linear-gradient(180deg, var(--paper) 0%, var(--paper-deep) 100%);
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:28px 14px 60px;
  }
  h1,h2,h3,.display{font-family:'Baloo 2', sans-serif;}
  .wrap{ width:100%; max-width:640px; }

  .header{ text-align:center; margin-bottom:16px; }
  .eyebrow{
    display:inline-block;
    background:var(--teal);
    color:#fff;
    font-weight:800;
    font-family:'Baloo 2', sans-serif;
    padding:4px 16px;
    border-radius:999px;
    font-size:13px;
    letter-spacing:.5px;
    margin-bottom:10px;
    transform:rotate(-2deg);
  }
  .header h1{ font-size:28px; font-weight:800; margin:0 0 4px; color:var(--ink); }
  .header p{ margin:0; font-weight:700; color:#6b7f8c; font-size:14px; }

  /* --- Signature element: cloud badges like the whiteboard numbering --- */
  .clouds{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin:20px 0 22px;
  }
  .cloud{
    position:relative;
    background:#fff;
    border:3px solid var(--ink);
    border-radius:50% 50% 50% 50% / 55% 55% 45% 45%;
    width:78px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 5px 0 rgba(35,61,77,0.18);
  }
  .cloud::before, .cloud::after{
    content:"";
    position:absolute;
    background:#fff;
    border:3px solid var(--ink);
    border-radius:50%;
  }
  .cloud::before{ width:26px; height:26px; top:-12px; left:10px; }
  .cloud::after{ width:22px; height:22px; top:-9px; right:8px; }
  .cloud span{
    position:relative;
    z-index:2;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:13px;
    color:var(--ink);
    text-align:center;
    padding:0 4px;
  }
  .cloud:nth-child(1) span{ color:var(--burnt); }
  .cloud:nth-child(2) span{ color:var(--teal); }
  .cloud:nth-child(3) span{ color:var(--marigold); }
  .cloud:nth-child(4) span{ color:var(--leaf); }

  .progress{ display:flex; gap:5px; justify-content:center; margin-bottom:18px; flex-wrap:wrap; }
  .dot{ width:16px;height:16px;border-radius:50%; background:#ffffffaa; border:2px solid #e3d6b3; transition:.2s; }
  .dot.done-correct{ background:var(--leaf); border-color:var(--leaf); }
  .dot.done-wrong{ background:var(--burnt); border-color:var(--burnt); }
  .dot.current{ border-color:var(--ink); transform:scale(1.25); }

  .card{
    background:var(--white);
    border-radius:26px;
    padding:26px 22px 24px;
    box-shadow: var(--shadow);
    border:3px solid var(--ink);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:-30px; right:-30px;
    width:90px;height:90px;
    background:var(--marigold);
    border-radius:50%;
    opacity:.45;
  }
  .qnum{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'Baloo 2', sans-serif; font-weight:700;
    color:var(--teal); font-size:14px; margin-bottom:6px;
  }
  .qtext{
    font-size:19px; font-weight:800;
    font-family:'Baloo 2', sans-serif;
    line-height:1.45; color:var(--ink);
    margin:4px 0 18px;
    position:relative; z-index:1;
  }
  .qtext .highlight{
    display:inline-block;
    background:var(--paper-deep);
    border-radius:8px;
    padding:2px 10px;
    color:var(--burnt);
  }

  .options{
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
    position:relative; z-index:1;
  }
  .options.two{ grid-template-columns:1fr; }
  .opt{
    border:3px solid #ead9b3;
    background:#fffdf6;
    border-radius:16px;
    padding:16px 12px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:17px;
    color:var(--ink);
    transition:.15s;
    text-align:center;
  }
  .opt:hover:not(.locked){ border-color:var(--teal); transform:translateY(-2px); }
  .opt.correct{ background:#eaf5e6; border-color:var(--leaf); }
  .opt.wrong{ background:#fdece5; border-color:var(--burnt); }
  .opt.locked{ cursor:default; opacity:.78; }
  .opt.locked:hover{ transform:none; }

  .feedback{
    margin-top:16px; font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:15px; min-height:22px; text-align:center;
  }
  .feedback.ok{ color:var(--leaf); }
  .feedback.no{ color:var(--burnt); }

  .next-btn{
    display:block; margin:16px auto 0;
    background:var(--ink); color:#fff; border:none;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:15px;
    padding:12px 28px; border-radius:999px; cursor:pointer;
    box-shadow:0 5px 0 #12242e;
    visibility:hidden;
  }
  .next-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 #12242e; }

  .result{ text-align:center; }
  .result .score{
    font-family:'Baloo 2', sans-serif; font-size:56px; font-weight:800;
    color:var(--burnt); margin:6px 0 0;
  }
  .result .score span{ font-size:26px; color:#9aa9b2; }
  .result .msg{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:18px; margin:6px 0 22px; }
  .result .stars{ font-size:34px; margin-bottom:6px; }

  .btn-row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:8px; }
  .btn{
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:15px;
    padding:12px 22px; border-radius:999px; cursor:pointer; border:none;
  }
  .btn.primary{ background:var(--burnt); color:#fff; box-shadow:0 5px 0 #b23f1f; }
  .btn.primary:active{ transform:translateY(3px); box-shadow:0 2px 0 #b23f1f; }
  .btn.ghost{ background:#fff; color:var(--ink); border:3px solid var(--ink); box-shadow:0 5px 0 rgba(35,61,77,0.25); }
  .btn.ghost:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(35,61,77,0.25); }

  .toolbar{ display:flex; justify-content:center; margin-top:16px; }

  footer{ text-align:center; margin-top:22px; font-size:12px; color:#8a97a0; font-weight:700; }

  @media (max-width:420px){
    .qtext{ font-size:17px; }
    .opt{ font-size:15px; padding:13px 8px; }
    .cloud{ width:64px; height:50px; }
    .cloud span{ font-size:11px; }
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <span class="eyebrow">KELAS 1 · AYO BERLATIH</span>
    <h1>Kuis Bahasa Indonesia</h1>
    <p>Latihan huruf vokal, jenis bunyi, sikap membaca, dan suku kata "ba"</p>
  </div>

  <div class="clouds">
    <div class="cloud"><span>A I U E O</span></div>
    <div class="cloud"><span>🔊 Bunyi</span></div>
    <div class="cloud"><span>📖 Duduk</span></div>
    <div class="cloud"><span>BA...</span></div>
  </div>

  <div class="progress" id="progress"></div>

  <div class="card" id="card"></div>

  <div class="toolbar">
    <button class="btn ghost" id="regenBtn">🔄 Buat 15 Soal Baru</button>
  </div>

  <footer>Latihan interaktif · Huruf vokal, bunyi bahasa, sikap membaca, suku kata "ba"</footer>
</div>

<script>
/* ---------------------------------------------------------
   DATA sesuai papan tulis "Ayo Berlatih"
--------------------------------------------------------- */

// 1) Kata & huruf vokal di dalamnya (urutan huruf a,i,u,e,o)
const VOWEL_ORDER = ["a","i","u","e","o"];
const WORDS = [
  "belajar","buku","sekolah","ibu","bapak","meja","kursi",
  "pensil","sepatu","topi","bola","buah","nasi","susu",
  "roti","kue","ayah","dokter"
];
function vowelsOf(word){
  const found = new Set();
  for(const ch of word.toLowerCase()){
    if(VOWEL_ORDER.includes(ch)) found.add(ch);
  }
  return VOWEL_ORDER.filter(v=>found.has(v));
}

// 2) Jenis bunyi: bahasa / bukan bahasa
const SOUNDS = [
  { desc:"suara mesin mobil",               correct:"bukan bahasa" },
  { desc:"suara ibu bernyanyi",              correct:"bahasa" },
  { desc:"suara kucing mengeong",            correct:"bukan bahasa" },
  { desc:"suara petir menggelegar",          correct:"bukan bahasa" },
  { desc:"suara teman bercerita",            correct:"bahasa" },
  { desc:"suara ayam berkokok",              correct:"bukan bahasa" },
  { desc:"suara guru menjelaskan pelajaran", correct:"bahasa" },
  { desc:"suara angin bertiup kencang",      correct:"bukan bahasa" },
  { desc:"suara adik membaca puisi",         correct:"bahasa" },
  { desc:"suara petasan meletus",            correct:"bukan bahasa" },
  { desc:"suara kakak bercerita dongeng",    correct:"bahasa" },
  { desc:"suara air sungai mengalir",        correct:"bukan bahasa" },
  { desc:"suara kereta api lewat",           correct:"bukan bahasa" },
  { desc:"suara ayah membaca koran keras-keras", correct:"bahasa" }
];

// 3) Sikap membaca / duduk yang benar
const POSTURE_QUESTIONS = [
  { text:"Saat membaca buku, punggung harus ...", correct:"tegak / lurus" },
  { text:"Posisi duduk yang benar saat menulis adalah ...", correct:"tegak / lurus" },
  { text:"Agar tidak cepat lelah saat belajar, punggung sebaiknya ...", correct:"tegak / lurus" },
  { text:"Sikap tubuh yang baik ketika membaca di kelas adalah ...", correct:"tegak / lurus" }
];
const POSTURE_OPTIONS = ["tegak / lurus","membungkuk","miring ke samping","tiduran"];

// 4) Kata berawalan suku kata "ba"
const BA_WORDS = ["baju","batu","badak","bayi","balon","bawang","bapak","baik"];
const NON_BA_WORDS = ["kursi","meja","topi","kucing","ikan","nasi","pensil","susu","roti","kue","ayah","sekolah","bola","buku","ibu","gigi","roda","kaki","lampu","kuda"];

const TOTAL_Q = 15;

/* ---------------------------------------------------------
   Helper
--------------------------------------------------------- */
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = randInt(0,i);
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function cap(word){ return word.charAt(0).toUpperCase()+word.slice(1); }

/* ---------------------------------------------------------
   Template soal
--------------------------------------------------------- */
const templates = [
  // A. Huruf vokal pada kata
  function(){
    const idx = randInt(0,WORDS.length-1);
    const word = WORDS[idx];
    const correctArr = vowelsOf(word);
    const correct = correctArr.join(", ");
    let others = WORDS.filter((_,i)=>i!==idx).map(w=>vowelsOf(w).join(", ")).filter(v=>v!==correct);
    others = [...new Set(others)];
    const distractors = shuffle(others).slice(0,3);
    const options = shuffle([correct, ...distractors]);
    return {
      text: `Huruf vokal pada kata <span class="highlight">${word}</span> adalah ...`,
      options, correct, cols:2
    };
  },
  // B. Jenis bunyi
  function(){
    const idx = randInt(0,SOUNDS.length-1);
    const s = SOUNDS[idx];
    const options = shuffle(["bahasa","bukan bahasa"]).map(o=> o==="bahasa" ? "Bunyi bahasa" : "Bunyi bukan bahasa");
    const correct = s.correct === "bahasa" ? "Bunyi bahasa" : "Bunyi bukan bahasa";
    return {
      text: `${cap(s.desc)} termasuk ...`,
      options, correct, cols:1
    };
  },
  // C. Sikap membaca / duduk
  function(){
    const idx = randInt(0,POSTURE_QUESTIONS.length-1);
    const p = POSTURE_QUESTIONS[idx];
    const options = shuffle(POSTURE_OPTIONS);
    return {
      text: p.text,
      options, correct:p.correct, cols:2
    };
  },
  // D. Kata berawalan suku kata "ba"
  function(){
    const correctWord = BA_WORDS[randInt(0,BA_WORDS.length-1)];
    const distractors = shuffle(NON_BA_WORDS).slice(0,3);
    const options = shuffle([correctWord, ...distractors]).map(cap);
    return {
      text: `Manakah kata yang diawali suku kata <span class="highlight">"ba"</span>?`,
      options, correct: cap(correctWord), cols:2
    };
  },
  // E. Kebalikan: kata tertentu diawali suku kata apa?
  function(){
    const correctWord = BA_WORDS[randInt(0,BA_WORDS.length-1)];
    const options = shuffle(["ba","bu","bi","be"]);
    return {
      text: `Kata <span class="highlight">${correctWord}</span> diawali dengan suku kata ...`,
      options, correct:"ba", cols:2
    };
  }
];

function generateQuestions(n){
  const qs = [];
  let guard = 0;
  const seenTexts = new Set();
  while(qs.length < n && guard < n*40){
    guard++;
    const t = templates[randInt(0,templates.length-1)];
    const q = t();
    const key = q.text + "|" + q.correct;
    if(q && !seenTexts.has(key)){
      seenTexts.add(key);
      qs.push(q);
    }
  }
  return qs;
}

/* ---------------------------------------------------------
   State & render
--------------------------------------------------------- */
let questions = [];
let current = 0;
let score = 0;
let answers = [];

function initQuiz(){
  questions = generateQuestions(TOTAL_Q);
  current = 0;
  score = 0;
  answers = new Array(TOTAL_Q).fill(null);
  renderProgress();
  renderQuestion();
}

function renderProgress(){
  const el = document.getElementById("progress");
  el.innerHTML = questions.map((_,i)=>{
    let cls = "dot";
    if(i === current) cls += " current";
    if(answers[i] === "correct") cls += " done-correct";
    if(answers[i] === "wrong") cls += " done-wrong";
    return `<div class="${cls}"></div>`;
  }).join("");
}

function renderQuestion(){
  const card = document.getElementById("card");
  if(current >= questions.length){ renderResult(); return; }

  const q = questions[current];
  const optClass = q.cols === 1 ? "options two" : "options";
  card.innerHTML = `
    <div class="qnum">Soal ${current+1} dari ${questions.length}</div>
    <div class="qtext">${q.text}</div>
    <div class="${optClass}" id="optWrap"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">Soal Berikutnya →</button>
  `;

  const optWrap = document.getElementById("optWrap");
  q.options.forEach(val=>{
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.innerHTML = `<span>${val}</span>`;
    btn.addEventListener("click", ()=> selectAnswer(val, q, btn));
    optWrap.appendChild(btn);
  });

  renderProgress();
}

function selectAnswer(value, q, btnEl){
  const optWrap = document.getElementById("optWrap");
  if(optWrap.dataset.locked === "1") return;
  optWrap.dataset.locked = "1";

  const buttons = Array.from(optWrap.children);
  buttons.forEach(b=> b.classList.add("locked"));

  const isCorrect = value === q.correct;
  const feedback = document.getElementById("feedback");
  const nextBtn = document.getElementById("nextBtn");

  buttons.forEach(b=>{
    if(b.textContent.trim() === String(q.correct).trim()){
      b.classList.add("correct");
    }
  });

  if(isCorrect){
    btnEl.classList.add("correct");
    feedback.textContent = "🎉 Benar sekali! Hebat!";
    feedback.className = "feedback ok";
    answers[current] = "correct";
    score++;
  } else {
    btnEl.classList.add("wrong");
    feedback.textContent = "Belum tepat, lihat jawaban yang benar ya!";
    feedback.className = "feedback no";
    answers[current] = "wrong";
  }

  nextBtn.style.visibility = "visible";
  nextBtn.onclick = ()=>{
    current++;
    renderQuestion();
  };

  renderProgress();
}

function renderResult(){
  const card = document.getElementById("card");
  const pct = Math.round((score/questions.length)*100);
  let stars = "⭐";
  let msg = "Ayo semangat berlatih lagi!";
  if(pct >= 80){ stars = "⭐⭐⭐"; msg = "Luar biasa! Kamu jagoan Bahasa Indonesia!"; }
  else if(pct >= 50){ stars = "⭐⭐"; msg = "Bagus! Sedikit lagi jadi jagoan!"; }

  card.innerHTML = `
    <div class="result">
      <div class="stars">${stars}</div>
      <div class="qnum" style="justify-content:center;">HASIL LATIHAN</div>
      <div class="score">${score}<span>/${questions.length}</span></div>
      <div class="msg">${msg}</div>
      <div class="btn-row">
        <button class="btn primary" id="retrySame">↺ Ulangi Soal Ini</button>
        <button class="btn ghost" id="newSet">🔄 Soal Baru</button>
      </div>
    </div>
  `;

  document.getElementById("retrySame").addEventListener("click", ()=>{
    current = 0;
    score = 0;
    answers = new Array(questions.length).fill(null);
    renderQuestion();
  });
  document.getElementById("newSet").addEventListener("click", initQuiz);

  document.getElementById("progress").innerHTML = "";
}

/* ---------------------------------------------------------
   Init
--------------------------------------------------------- */
document.getElementById("regenBtn").addEventListener("click", initQuiz);
initQuiz();
</script>
</body>
</html>
