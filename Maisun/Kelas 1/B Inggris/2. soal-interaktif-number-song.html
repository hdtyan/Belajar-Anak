<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Song - Kuis Angka Bahasa Inggris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF7EA;
    --cream-deep:#FFEBCB;
    --plum:#3B2A52;
    --grape:#8B5FBF;
    --mint:#3FBFA0;
    --sun:#FFB238;
    --berry:#E85D75;
    --white:#FFFFFF;
    --shadow: 0 8px 0 rgba(59,42,82,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 8% 10%, #fff 0 2.6%, transparent 3.2%),
      radial-gradient(circle at 90% 12%, #fff 0 2.2%, transparent 2.8%),
      radial-gradient(circle at 85% 88%, #fff 0 2.4%, transparent 3%),
      radial-gradient(circle at 5% 82%, #fff 0 1.8%, transparent 2.4%),
      linear-gradient(180deg, var(--cream) 0%, var(--cream-deep) 100%);
    font-family:'Nunito', sans-serif;
    color:var(--plum);
    display:flex;
    justify-content:center;
    padding:28px 14px 60px;
  }
  h1,h2,h3,.display{font-family:'Baloo 2', sans-serif;}
  .wrap{ width:100%; max-width:640px; }

  .header{ text-align:center; margin-bottom:18px; }
  .eyebrow{
    display:inline-block;
    background:var(--mint);
    color:#fff;
    font-weight:800;
    font-family:'Baloo 2', sans-serif;
    padding:4px 16px;
    border-radius:999px;
    font-size:13px;
    letter-spacing:.5px;
    margin-bottom:10px;
    transform:rotate(-2deg);
  }
  .header h1{ font-size:28px; font-weight:800; margin:0 0 4px; color:var(--plum); }
  .header p{ margin:0; font-weight:700; color:#7a6a94; font-size:14px; }

  /* --- Signature element: musical staff with numbered notes 1-10 --- */
  .staff{
    position:relative;
    margin:20px auto 24px;
    max-width:560px;
    padding:14px 10px 6px;
  }
  .staff .lines{
    position:absolute;
    left:8px; right:8px; top:34px;
    height:0;
    border-top:2px solid #d8c8ea;
    box-shadow:
      0 10px 0 #d8c8ea,
      0 20px 0 #d8c8ea,
      0 30px 0 #d8c8ea,
      0 40px 0 #d8c8ea;
  }
  .notes{
    display:flex;
    justify-content:space-between;
    position:relative;
    z-index:1;
  }
  .note{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .note .head{
    width:26px;height:20px;
    border-radius:50%;
    background:var(--grape);
    display:flex;align-items:center;justify-content:center;
    color:#fff;
    font-family:'Baloo 2', sans-serif;
    font-size:11px;
    font-weight:800;
    transform:rotate(-14deg);
    box-shadow:0 3px 0 rgba(59,42,82,0.25);
  }
  .note .stem{ width:2px; height:26px; background:var(--grape); }
  .note:nth-child(even) .head{ background:var(--berry); }
  .note:nth-child(even) .stem{ background:var(--berry); }
  .note:nth-child(3n) .head{ background:var(--sun); color:var(--plum); }
  .note:nth-child(3n) .stem{ background:var(--sun); }

  /* --- Progress dots --- */
  .progress{ display:flex; gap:5px; justify-content:center; margin-bottom:18px; flex-wrap:wrap; }
  .dot{ width:16px;height:16px;border-radius:50%; background:#ffffffaa; border:2px solid #ead9c0; transition:.2s; }
  .dot.done-correct{ background:var(--mint); border-color:var(--mint); }
  .dot.done-wrong{ background:var(--berry); border-color:var(--berry); }
  .dot.current{ border-color:var(--plum); transform:scale(1.25); }

  .card{
    background:var(--white);
    border-radius:26px;
    padding:26px 22px 24px;
    box-shadow: var(--shadow);
    border:3px solid var(--plum);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"♪";
    position:absolute;
    top:-14px; right:6px;
    font-size:70px;
    color:var(--sun);
    opacity:.35;
    font-family:'Baloo 2', sans-serif;
  }
  .qnum{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'Baloo 2', sans-serif; font-weight:700;
    color:var(--grape); font-size:14px; margin-bottom:6px;
  }
  .qtext{
    font-size:20px; font-weight:800;
    font-family:'Baloo 2', sans-serif;
    line-height:1.4; color:var(--plum);
    margin:4px 0 18px;
    position:relative; z-index:1;
  }
  .qtext .highlight{
    display:inline-block;
    background:var(--cream-deep);
    border-radius:8px;
    padding:2px 10px;
    color:var(--berry);
  }

  .options{
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
    position:relative; z-index:1;
  }
  .opt{
    border:3px solid #ecdfd0;
    background:#fffaf3;
    border-radius:16px;
    padding:16px 10px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:18px;
    color:var(--plum);
    transition:.15s;
    text-align:center;
  }
  .opt:hover:not(.locked){ border-color:var(--grape); transform:translateY(-2px); }
  .opt.correct{ background:#e4f7f1; border-color:var(--mint); }
  .opt.wrong{ background:#fdeaee; border-color:var(--berry); }
  .opt.locked{ cursor:default; opacity:.78; }
  .opt.locked:hover{ transform:none; }

  .feedback{
    margin-top:16px; font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:15px; min-height:22px; text-align:center;
  }
  .feedback.ok{ color:var(--mint); }
  .feedback.no{ color:var(--berry); }

  .next-btn{
    display:block; margin:16px auto 0;
    background:var(--plum); color:#fff; border:none;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:15px;
    padding:12px 28px; border-radius:999px; cursor:pointer;
    box-shadow:0 5px 0 #241a35;
    visibility:hidden;
  }
  .next-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 #241a35; }

  .result{ text-align:center; }
  .result .score{
    font-family:'Baloo 2', sans-serif; font-size:56px; font-weight:800;
    color:var(--berry); margin:6px 0 0;
  }
  .result .score span{ font-size:26px; color:#a795bf; }
  .result .msg{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:18px; margin:6px 0 22px; }
  .result .stars{ font-size:34px; margin-bottom:6px; }

  .btn-row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:8px; }
  .btn{
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:15px;
    padding:12px 22px; border-radius:999px; cursor:pointer; border:none;
  }
  .btn.primary{ background:var(--berry); color:#fff; box-shadow:0 5px 0 #b8435a; }
  .btn.primary:active{ transform:translateY(3px); box-shadow:0 2px 0 #b8435a; }
  .btn.ghost{ background:#fff; color:var(--plum); border:3px solid var(--plum); box-shadow:0 5px 0 rgba(59,42,82,0.25); }
  .btn.ghost:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(59,42,82,0.25); }

  .toolbar{ display:flex; justify-content:center; margin-top:16px; }

  footer{ text-align:center; margin-top:22px; font-size:12px; color:#95839. ; color:#96829. ; }
  footer{ color:#93809f; font-weight:700; }

  @media (max-width:420px){
    .qtext{ font-size:18px; }
    .opt{ font-size:16px; padding:12px 8px; }
    .staff .lines{ display:none; }
    .note .head{ width:22px; height:17px; font-size:10px; }
    .note .stem{ height:18px; }
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <span class="eyebrow">KELAS 1 · NUMBER SONG</span>
    <h1>Kuis Lagu Angka</h1>
    <p>Yuk bernyanyi sambil belajar angka 1 - 10 dalam Bahasa Inggris!</p>
  </div>

  <div class="staff" id="staff">
    <div class="lines"></div>
    <div class="notes" id="notes"></div>
  </div>

  <div class="progress" id="progress"></div>

  <div class="card" id="card"></div>

  <div class="toolbar">
    <button class="btn ghost" id="regenBtn">🔄 Buat 15 Soal Baru</button>
  </div>

  <footer>Latihan interaktif · Angka Bahasa Inggris 1 - 10 (Number Song)</footer>
</div>

<script>
/* ---------------------------------------------------------
   DATA sesuai papan tulis "Number Song"
--------------------------------------------------------- */
const NUMBERS = [
  { n:1,  en:"one",   id:"satu" },
  { n:2,  en:"two",   id:"dua" },
  { n:3,  en:"three", id:"tiga" },
  { n:4,  en:"four",  id:"empat" },
  { n:5,  en:"five",  id:"lima" },
  { n:6,  en:"six",   id:"enam" },
  { n:7,  en:"seven", id:"tujuh" },
  { n:8,  en:"eight", id:"delapan" },
  { n:9,  en:"nine",  id:"sembilan" },
  { n:10, en:"ten",   id:"sepuluh" }
];
const TOTAL_Q = 15;

function renderStaff(){
  const el = document.getElementById("notes");
  el.innerHTML = NUMBERS.map(item=>`
    <div class="note">
      <div class="stem"></div>
      <div class="head">${item.n}</div>
    </div>
  `).join("");
}

/* ---------------------------------------------------------
   Helper
--------------------------------------------------------- */
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = randInt(0,i);
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function cap(word){ return word.charAt(0).toUpperCase()+word.slice(1); }

/* ---------------------------------------------------------
   Template soal
--------------------------------------------------------- */
const templates = [
  // 1. English word -> Indonesian word
  function(){
    const idx = randInt(0,9);
    const item = NUMBERS[idx];
    const correct = item.id;
    const distractors = shuffle(NUMBERS.filter((_,i)=>i!==idx)).slice(0,3).map(x=>x.id);
    const options = shuffle([correct, ...distractors]);
    return {
      text: `Kata <span class="highlight">${cap(item.en)}</span> dalam Bahasa Indonesia artinya ...`,
      options, correct
    };
  },
  // 2. Indonesian word -> English word
  function(){
    const idx = randInt(0,9);
    const item = NUMBERS[idx];
    const correct = item.en;
    const distractors = shuffle(NUMBERS.filter((_,i)=>i!==idx)).slice(0,3).map(x=>x.en);
    const options = shuffle([correct, ...distractors]);
    return {
      text: `Kata <span class="highlight">${cap(item.id)}</span> dalam Bahasa Inggris adalah ...`,
      options, correct
    };
  },
  // 3. Angka -> English word
  function(){
    const idx = randInt(0,9);
    const item = NUMBERS[idx];
    const correct = item.en;
    const distractors = shuffle(NUMBERS.filter((_,i)=>i!==idx)).slice(0,3).map(x=>x.en);
    const options = shuffle([correct, ...distractors]);
    return {
      text: `Angka <span class="highlight">${item.n}</span> dalam Bahasa Inggris dibaca ...`,
      options, correct
    };
  },
  // 4. Angka -> Indonesian word
  function(){
    const idx = randInt(0,9);
    const item = NUMBERS[idx];
    const correct = item.id;
    const distractors = shuffle(NUMBERS.filter((_,i)=>i!==idx)).slice(0,3).map(x=>x.id);
    const options = shuffle([correct, ...distractors]);
    return {
      text: `Angka <span class="highlight">${item.n}</span> dalam Bahasa Indonesia dibaca ...`,
      options, correct
    };
  },
  // 5. English word -> angka
  function(){
    const idx = randInt(0,9);
    const item = NUMBERS[idx];
    const correct = String(item.n);
    const distractors = shuffle(NUMBERS.filter((_,i)=>i!==idx)).slice(0,3).map(x=>String(x.n));
    const options = shuffle([correct, ...distractors]);
    return {
      text: `Kata <span class="highlight">${cap(item.en)}</span> menunjukkan angka ...`,
      options, correct
    };
  },
  // 6. Indonesian word -> angka
  function(){
    const idx = randInt(0,9);
    const item = NUMBERS[idx];
    const correct = String(item.n);
    const distractors = shuffle(NUMBERS.filter((_,i)=>i!==idx)).slice(0,3).map(x=>String(x.n));
    const options = shuffle([correct, ...distractors]);
    return {
      text: `Kata <span class="highlight">${cap(item.id)}</span> menunjukkan angka ...`,
      options, correct
    };
  }
];

function generateQuestions(n){
  const qs = [];
  let guard = 0;
  const seenTexts = new Set();
  while(qs.length < n && guard < n*30){
    guard++;
    const t = templates[randInt(0,templates.length-1)];
    const q = t();
    if(q && !seenTexts.has(q.text)){
      seenTexts.add(q.text);
      qs.push(q);
    }
  }
  return qs;
}

/* ---------------------------------------------------------
   State & render
--------------------------------------------------------- */
let questions = [];
let current = 0;
let score = 0;
let answers = [];

function initQuiz(){
  questions = generateQuestions(TOTAL_Q);
  current = 0;
  score = 0;
  answers = new Array(TOTAL_Q).fill(null);
  renderProgress();
  renderQuestion();
}

function renderProgress(){
  const el = document.getElementById("progress");
  el.innerHTML = questions.map((_,i)=>{
    let cls = "dot";
    if(i === current) cls += " current";
    if(answers[i] === "correct") cls += " done-correct";
    if(answers[i] === "wrong") cls += " done-wrong";
    return `<div class="${cls}"></div>`;
  }).join("");
}

function renderQuestion(){
  const card = document.getElementById("card");
  if(current >= questions.length){ renderResult(); return; }

  const q = questions[current];
  card.innerHTML = `
    <div class="qnum">Soal ${current+1} dari ${questions.length}</div>
    <div class="qtext">${q.text}</div>
    <div class="options" id="optWrap"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">Soal Berikutnya →</button>
  `;

  const optWrap = document.getElementById("optWrap");
  q.options.forEach(val=>{
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.innerHTML = `<span>${cap(val)}</span>`;
    btn.addEventListener("click", ()=> selectAnswer(val, q, btn));
    optWrap.appendChild(btn);
  });

  renderProgress();
}

function selectAnswer(value, q, btnEl){
  const optWrap = document.getElementById("optWrap");
  if(optWrap.dataset.locked === "1") return;
  optWrap.dataset.locked = "1";

  const buttons = Array.from(optWrap.children);
  buttons.forEach(b=> b.classList.add("locked"));

  const isCorrect = value === q.correct;
  const feedback = document.getElementById("feedback");
  const nextBtn = document.getElementById("nextBtn");

  buttons.forEach(b=>{
    if(b.textContent.trim().toLowerCase() === String(q.correct).toLowerCase()){
      b.classList.add("correct");
    }
  });

  if(isCorrect){
    btnEl.classList.add("correct");
    feedback.textContent = "🎵 Benar sekali! Terus bernyanyi!";
    feedback.className = "feedback ok";
    answers[current] = "correct";
    score++;
  } else {
    btnEl.classList.add("wrong");
    feedback.textContent = "Belum tepat, lihat jawaban yang benar ya!";
    feedback.className = "feedback no";
    answers[current] = "wrong";
  }

  nextBtn.style.visibility = "visible";
  nextBtn.onclick = ()=>{
    current++;
    renderQuestion();
  };

  renderProgress();
}

function renderResult(){
  const card = document.getElementById("card");
  const pct = Math.round((score/questions.length)*100);
  let stars = "⭐";
  let msg = "Ayo semangat berlatih lagi!";
  if(pct >= 80){ stars = "⭐⭐⭐"; msg = "Luar biasa! Kamu jago Number Song!"; }
  else if(pct >= 50){ stars = "⭐⭐"; msg = "Bagus! Sedikit lagi jadi jagoan!"; }

  card.innerHTML = `
    <div class="result">
      <div class="stars">${stars}</div>
      <div class="qnum" style="justify-content:center;">HASIL LATIHAN</div>
      <div class="score">${score}<span>/${questions.length}</span></div>
      <div class="msg">${msg}</div>
      <div class="btn-row">
        <button class="btn primary" id="retrySame">↺ Ulangi Soal Ini</button>
        <button class="btn ghost" id="newSet">🔄 Soal Baru</button>
      </div>
    </div>
  `;

  document.getElementById("retrySame").addEventListener("click", ()=>{
    current = 0;
    score = 0;
    answers = new Array(questions.length).fill(null);
    renderQuestion();
  });
  document.getElementById("newSet").addEventListener("click", initQuiz);

  document.getElementById("progress").innerHTML = "";
}

/* ---------------------------------------------------------
   Init
--------------------------------------------------------- */
document.getElementById("regenBtn").addEventListener("click", initQuiz);
renderStaff();
initQuiz();
</script>
</body>
</html>
