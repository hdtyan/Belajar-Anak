<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Irama Anggota Tubuh</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');

  :root{
    --cream:#fff8ec;
    --orange:#ff8a3d;
    --orange-light:#ffe4cc;
    --teal:#2fa9a1;
    --teal-light:#dff5f2;
    --purple:#7d5fd4;
    --green:#4caf7d;
    --red:#e6584f;
    --ink:#3a2e2e;
    --card-shadow: 0 6px 0 rgba(0,0,0,0.06);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    font-family:'Nunito', sans-serif;
    background:
      radial-gradient(circle at 6% 10%, #ffe0c2 0, transparent 42%),
      radial-gradient(circle at 94% 88%, #d6f3ef 0, transparent 42%),
      var(--cream);
    color:var(--ink);
    padding:18px;
  }

  .sheet{ max-width:820px; margin:0 auto; }

  header.title{
    text-align:center;
    background:#fff;
    border-radius:28px;
    padding:22px 18px 24px;
    box-shadow:var(--card-shadow);
    border:3px dashed var(--orange);
  }

  header.title .eyebrow{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    letter-spacing:2px;
    color:var(--purple);
    font-size:13px;
    text-transform:uppercase;
  }

  header.title h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(24px, 6vw, 36px);
    margin:6px 0 10px;
    background:linear-gradient(90deg,#ff8a3d,#2fa9a1,#7d5fd4);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  header.title .sub{
    display:inline-block;
    background:var(--teal);
    color:#fff;
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    padding:6px 18px;
    border-radius:999px;
    font-size:13px;
  }

  .idbox{
    margin-top:16px;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
  }
  .idbox label{
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .idbox input{
    border:2px solid var(--orange-light);
    background:var(--orange-light);
    border-radius:10px;
    padding:7px 10px;
    font-family:'Nunito',sans-serif;
    font-size:14px;
    width:140px;
    outline:none;
  }
  .idbox input:focus{ border-color:var(--orange); }

  .qcard{
    margin-top:18px;
    background:#fff;
    border-radius:22px;
    padding:18px 18px 20px;
    box-shadow:var(--card-shadow);
    border:3px solid var(--teal-light);
  }

  .qhead{
    display:flex;
    align-items:flex-start;
    gap:12px;
    margin-bottom:14px;
  }
  .qnum{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    color:#fff;
    background:var(--orange);
    width:34px;height:34px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    flex:none;
  }
  .qtext{
    font-family:'Baloo 2', sans-serif;
    font-size:16.5px;
    line-height:1.4;
    padding-top:4px;
  }

  .options{
    display:grid;
    gap:9px;
  }

  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    background:#fbfaf7;
    border:2px solid #ece6df;
    border-radius:14px;
    padding:11px 14px;
    cursor:pointer;
    font-size:15px;
    transition:all .15s ease;
    touch-action:manipulation;
  }
  .opt:hover{ border-color:var(--orange); }
  .opt .letter{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    width:26px;height:26px;
    border-radius:50%;
    background:#e9e4dd;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;
    flex:none;
  }
  .opt.selected{
    border-color:var(--orange);
    background:var(--orange-light);
  }
  .opt.selected .letter{ background:var(--orange); color:#fff; }

  .opt.correct{
    border-color:var(--green);
    background:#e7f6ee;
  }
  .opt.correct .letter{ background:var(--green); color:#fff; }
  .opt.wrong{
    border-color:var(--red);
    background:#fdeceb;
  }
  .opt.wrong .letter{ background:var(--red); color:#fff; }

  .opt .mark{
    margin-left:auto;
    font-size:17px;
    display:none;
  }

  .controls{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-top:24px;
    flex-wrap:wrap;
  }
  .btn-main{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:16px;
    padding:13px 30px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,0.12);
    touch-action:manipulation;
  }
  .btn-check{ background:linear-gradient(90deg,var(--orange),var(--purple)); }
  .btn-reset{ background:#b9b1b1; }
  .btn-main:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,0.12); }

  .score-panel{
    display:none;
    margin-top:20px;
    text-align:center;
    background:#ffd166;
    color:#4a3300;
    border-radius:20px;
    padding:18px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:18px;
  }
  .score-panel .big{ font-size:30px; display:block; margin-bottom:4px;}

  footer.foot{
    text-align:center;
    margin:26px 0 6px;
    font-family:'Baloo 2', sans-serif;
    color:var(--purple);
    font-weight:700;
    font-size:15px;
  }
</style>
</head>
<body>
<div class="sheet">

  <header class="title">
    <div class="eyebrow">Kuis Interaktif</div>
    <h1>🥁 Irama Anggota Tubuh</h1>
    <div class="sub">Kelas 1 SD · Pilihan Ganda</div>
    <div class="idbox">
      <label>Nama: <input type="text" id="nama" placeholder="tulis namamu"></label>
      <label>Kelas: <input type="text" id="kelas" placeholder="1A" style="width:70px"></label>
      <label>No. Absen: <input type="text" id="absen" placeholder="00" style="width:70px"></label>
    </div>
  </header>

  <div id="quizArea"></div>

  <div class="controls">
    <button class="btn-main btn-check" onclick="checkAnswers()">✅ Periksa Jawaban</button>
    <button class="btn-main btn-reset" onclick="newSoal()">🔄 Soal Baru</button>
  </div>

  <div class="score-panel" id="scorePanel">
    <span class="big" id="scoreBig"></span>
    <span id="scoreMsg"></span>
  </div>

  <footer class="foot">🌟 Semangat Belajar! 🌟</footer>
</div>

<script>
// ---------- BANK SOAL ----------
// setiap soal: teks, list opsi, index opsi benar (sebelum diacak)
const QUESTION_BANK = [
  {
    text: 'Di dalam tubuh kita terdapat irama. Contohnya adalah suara ....',
    options: ['jantung kita', 'suara hujan', 'suara mobil', 'suara petir'],
    correct: 0
  },
  {
    text: 'Suara orang berjalan berbunyi ....',
    options: ['buk, buk, buk', 'tap, tap, tap', 'tek, tek, tek', 'lup, dup, lup, dup'],
    correct: 2
  },
  {
    text: 'Suara orang berlari berbunyi ....',
    options: ['tek, tek, tek', 'tap, tap, tap', 'buk, buk, buk', 'dup, dup, dup'],
    correct: 1
  },
  {
    text: 'Suara orang melompat berbunyi ....',
    options: ['tek, tek, tek', 'tap, tap, tap', 'buk, buk, buk', 'lup, dup'],
    correct: 2
  },
  {
    text: 'Bunyi "lup, dup, lup, dup" adalah suara dari ....',
    options: ['suara orang berjalan', 'suara orang berlari', 'suara jantung kita', 'suara orang melompat'],
    correct: 2
  }
];

const LETTERS = ['A','B','C','D'];

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let currentQuiz = []; // {text, options:[{label, isCorrect}], answered:null}

function buildQuiz(){
  // acak urutan soal + acak urutan opsi tiap soal
  const shuffledQuestions = shuffle(QUESTION_BANK);
  return shuffledQuestions.map(q => {
    const optObjs = q.options.map((opt, i) => ({ label: opt, isCorrect: i === q.correct }));
    const shuffledOpts = shuffle(optObjs);
    return { text: q.text, options: shuffledOpts, answered: null };
  });
}

function renderQuiz(){
  const area = document.getElementById('quizArea');
  area.innerHTML = '';
  currentQuiz.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'qcard';
    const optsHtml = q.options.map((opt, oi) => `
      <div class="opt" id="opt${qi}-${oi}" onclick="selectOpt(${qi},${oi})">
        <span class="letter">${LETTERS[oi]}</span>
        <span>${opt.label}</span>
        <span class="mark" id="mark${qi}-${oi}"></span>
      </div>
    `).join('');
    card.innerHTML = `
      <div class="qhead">
        <div class="qnum">${qi+1}</div>
        <div class="qtext">${q.text}</div>
      </div>
      <div class="options">${optsHtml}</div>
    `;
    area.appendChild(card);
  });
}

function selectOpt(qi, oi){
  currentQuiz[qi].answered = oi;
  currentQuiz[qi].options.forEach((_, i) => {
    document.getElementById(`opt${qi}-${i}`).classList.remove('selected');
  });
  document.getElementById(`opt${qi}-${oi}`).classList.add('selected');
}

function checkAnswers(){
  let correctCount = 0;
  currentQuiz.forEach((q, qi) => {
    q.options.forEach((opt, oi) => {
      const el = document.getElementById(`opt${qi}-${oi}`);
      const mark = document.getElementById(`mark${qi}-${oi}`);
      el.classList.remove('correct','wrong');
      mark.style.display = 'none';
      mark.textContent = '';

      if(opt.isCorrect){
        el.classList.add('correct');
        mark.style.display = 'inline';
        mark.textContent = '✅';
      } else if(q.answered === oi){
        el.classList.add('wrong');
        mark.style.display = 'inline';
        mark.textContent = '❌';
      }
    });
    if(q.answered !== null && q.options[q.answered].isCorrect) correctCount++;
  });

  const total = currentQuiz.length;
  const panel = document.getElementById('scorePanel');
  const big = document.getElementById('scoreBig');
  const msg = document.getElementById('scoreMsg');
  panel.style.display = 'block';
  big.textContent = `Skor: ${correctCount} / ${total}`;

  let text;
  if(correctCount === total) text = '🎉 Sempurna! Kamu hebat sekali!';
  else if(correctCount >= total*0.7) text = '👏 Bagus sekali, terus semangat belajar!';
  else if(correctCount >= total*0.4) text = '💪 Sudah lumayan, ayo coba lagi ya!';
  else text = '📚 Yuk periksa lagi jawabanmu, kamu pasti bisa!';
  msg.textContent = text;

  panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function newSoal(){
  currentQuiz = buildQuiz();
  renderQuiz();
  document.getElementById('scorePanel').style.display = 'none';
}

// ---------- INIT ----------
newSoal();
</script>
</body>
</html>
