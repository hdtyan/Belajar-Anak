<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Soal Interaktif - Belajar Anak</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');

  :root{
    --cream:#fff8ec;
    --pink:#ff7fa8;
    --purple:#7d5fd4;
    --ink:#3a2e2e;
    --shadow:0 6px 0 rgba(0,0,0,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Nunito', sans-serif;
    background:
      radial-gradient(circle at 6% 8%, #ffe0c2 0, transparent 42%),
      radial-gradient(circle at 94% 90%, #d6f3ef 0, transparent 42%),
      var(--cream);
    color:var(--ink);
    padding:20px;
  }
  .wrap{ max-width:900px; margin:0 auto; }

  header{
    text-align:center;
    background:#fff;
    border-radius:28px;
    padding:26px 18px;
    box-shadow:var(--shadow);
    border:3px dashed var(--pink);
  }
  header .eyebrow{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    letter-spacing:2px;
    color:var(--purple);
    font-size:13px;
    text-transform:uppercase;
  }
  header h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(26px, 6vw, 38px);
    margin:8px 0 6px;
    background:linear-gradient(90deg,#ff7fa8,#ffc94d,#4d8fdb,#2fb573);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header p{
    font-size:14.5px;
    color:#7a6a6a;
    margin:6px 0 0;
  }

  .status{
    text-align:center;
    font-family:'Baloo 2', sans-serif;
    color:#9a8a8a;
    margin:24px 0;
    font-size:14px;
  }

  .folders{
    margin-top:24px;
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
  }
  @media(min-width:640px){
    .folders{ grid-template-columns:1fr 1fr; }
  }

  .folder{
    background:#fff;
    border-radius:22px;
    padding:18px 18px 16px;
    box-shadow:var(--shadow);
    border:3px solid;
  }

  .folder-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
  }
  .folder-icon{
    font-size:26px;
    width:44px; height:44px;
    background:#fff;
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    flex:none;
    box-shadow:0 2px 0 rgba(0,0,0,0.06);
  }
  .folder-head h2{
    font-family:'Baloo 2', sans-serif;
    font-size:17px;
    margin:0;
  }
  .folder-head span{
    display:block;
    font-size:12px;
    color:#8a7a7a;
    font-weight:600;
  }

  .file-list{ display:grid; gap:8px; }
  .file-item{
    display:flex;
    align-items:center;
    gap:10px;
    background:#fff;
    border-radius:14px;
    padding:11px 13px;
    text-decoration:none;
    color:var(--ink);
    font-size:14.5px;
    font-weight:600;
    transition:transform .12s ease;
  }
  .file-item:hover{ transform:translateX(3px); }
  .file-item .fi-icon{ font-size:18px; flex:none; }
  .file-item .fi-arrow{ margin-left:auto; color:#bbb; }

  .error-box{
    background:#fff;
    border:2px solid #f3c7c2;
    border-radius:18px;
    padding:16px;
    text-align:center;
    color:#a83f34;
    font-size:14px;
    margin-top:20px;
  }

  footer{
    text-align:center;
    margin:26px 0 6px;
    font-family:'Baloo 2', sans-serif;
    color:var(--purple);
    font-weight:700;
    font-size:14px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Bank Soal Interaktif</div>
    <h1>📚 Belajar Anak - Kelas 1</h1>
    <p>Ketuk kategori di bawah, lalu pilih soal yang ingin dikerjakan. Semua soal terbuka langsung di browser, tidak perlu download.</p>
  </header>

  <div id="status" class="status">Memuat daftar soal...</div>
  <div id="folders" class="folders"></div>

  <footer>🌟 Belajar dengan semangat, prestasi pun akan hebat! 🌟</footer>
</div>

<script>
// ======== SESUAIKAN 3 BARIS INI KALAU REPO/PATH BERUBAH ========
const OWNER = 'hdtyan';
const REPO = 'Belajar-Anak';
const BASE_PATH = 'Maisun/Kelas 1'; // folder tempat semua kategori berada
// =================================================================

const COLOR_PALETTE = [
  {border:'#ffe3a3', bg:'#fff3d6'}, // kuning
  {border:'#ffe3ec', bg:'#ffe3ec'}, // pink
  {border:'#d8f5e6', bg:'#d8f5e6'}, // hijau
  {border:'#e1f0ff', bg:'#e1f0ff'}, // biru
  {border:'#ece5fb', bg:'#ece5fb'}, // ungu
];
const ICON_PALETTE = ['📘','🔢','🌍','🎵','🎨','🏃','🔤','🧪','🌱','⭐'];

function colorFor(name){
  let hash = 0;
  for(let i=0;i<name.length;i++) hash = name.charCodeAt(i) + ((hash<<5)-hash);
  const idx = Math.abs(hash) % COLOR_PALETTE.length;
  const icon = ICON_PALETTE[Math.abs(hash) % ICON_PALETTE.length];
  return {...COLOR_PALETTE[idx], icon};
}

function niceName(filename){
  return filename
    .replace(/\.html$/i, '')
    .replace(/[-_]/g, ' ')
    .replace(/\b\w/g, c => c.toUpperCase());
}

async function loadTree(){
  const statusEl = document.getElementById('status');
  const foldersEl = document.getElementById('folders');
  try{
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/main?recursive=1`);
    if(!res.ok) throw new Error('Gagal mengambil data dari GitHub (status ' + res.status + ')');
    const data = await res.json();

    const prefix = BASE_PATH + '/';
    const files = data.tree.filter(item =>
      item.type === 'blob' &&
      item.path.startsWith(prefix) &&
      item.path.toLowerCase().endsWith('.html')
    );

    const categories = {};
    files.forEach(f => {
      const rel = f.path.slice(prefix.length); // contoh: "B Indonesia/lkpd-vokal-konsonan.html"
      const parts = rel.split('/');
      if(parts.length < 2) return; // lewati file yang tidak ada di dalam subfolder kategori
      const cat = parts[0];
      const filename = parts[parts.length - 1];
      if(!categories[cat]) categories[cat] = [];
      categories[cat].push({ filename, path: f.path });
    });

    const catNames = Object.keys(categories).sort();

    if(catNames.length === 0){
      statusEl.textContent = 'Belum ada soal yang ditemukan. Upload file .html ke dalam folder kategori di dalam "' + BASE_PATH + '".';
      return;
    }

    statusEl.style.display = 'none';
    foldersEl.innerHTML = '';

    catNames.forEach(cat => {
      const color = colorFor(cat);
      const items = categories[cat].sort((a,b) => a.filename.localeCompare(b.filename));

      const div = document.createElement('div');
      div.className = 'folder';
      div.style.borderColor = color.border;
      div.style.background = color.bg;

      const fileItems = items.map(it => `
        <a class="file-item" href="${encodeURI(it.path)}">
          <span class="fi-icon">📝</span>
          <span>${niceName(it.filename)}</span>
          <span class="fi-arrow">›</span>
        </a>
      `).join('');

      div.innerHTML = `
        <div class="folder-head">
          <div class="folder-icon">${color.icon}</div>
          <div>
            <h2>${cat}</h2>
            <span>${items.length} soal</span>
          </div>
        </div>
        <div class="file-list">${fileItems}</div>
      `;
      foldersEl.appendChild(div);
    });

  } catch(err){
    statusEl.style.display = 'none';
    foldersEl.innerHTML = `<div class="error-box">⚠️ Tidak bisa memuat daftar soal otomatis.<br>${err.message}<br><br>Coba refresh halaman ini beberapa saat lagi.</div>`;
  }
}

loadTree();
</script>
</body>
</html>
