<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Soal Interaktif - Belajar Anak</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');

  :root{
    --cream:#fff8ec;
    --pink:#ff7fa8;
    --purple:#7d5fd4;
    --ink:#3a2e2e;
    --shadow:0 6px 0 rgba(0,0,0,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Nunito', sans-serif;
    background:
      radial-gradient(circle at 6% 8%, #ffe0c2 0, transparent 42%),
      radial-gradient(circle at 94% 90%, #d6f3ef 0, transparent 42%),
      var(--cream);
    color:var(--ink);
    padding:18px;
  }
  .wrap{ max-width:900px; margin:0 auto; }

  header{
    text-align:center;
    background:#fff;
    border-radius:28px;
    padding:24px 18px;
    box-shadow:var(--shadow);
    border:3px dashed var(--pink);
  }
  header .eyebrow{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    letter-spacing:2px;
    color:var(--purple);
    font-size:13px;
    text-transform:uppercase;
  }
  header h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(24px, 6vw, 34px);
    margin:8px 0 6px;
    background:linear-gradient(90deg,#ff7fa8,#ffc94d,#4d8fdb,#2fb573);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header p{
    font-size:14px;
    color:#7a6a6a;
    margin:6px 0 0;
  }

  .breadcrumb{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:4px;
    margin:18px 2px 0;
    font-family:'Baloo 2', sans-serif;
    font-size:14px;
  }
  .crumb{
    color:var(--purple);
    cursor:pointer;
    padding:4px 8px;
    border-radius:8px;
    font-weight:700;
  }
  .crumb:hover{ background:#fff; }
  .crumb.current{
    color:#8a7a7a;
    cursor:default;
  }
  .crumb.current:hover{ background:none; }
  .crumb-sep{ color:#c9beb2; }

  .status{
    text-align:center;
    font-family:'Baloo 2', sans-serif;
    color:#9a8a8a;
    margin:24px 0;
    font-size:14px;
  }

  .grid{
    margin-top:14px;
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
  }
  @media(min-width:640px){
    .grid.cards{ grid-template-columns:1fr 1fr; }
  }

  .card{
    background:#fff;
    border-radius:20px;
    padding:16px 18px;
    box-shadow:var(--shadow);
    border:3px solid;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:12px;
    transition:transform .1s ease;
  }
  .card:active{ transform:scale(0.98); }

  .card-icon{
    font-size:24px;
    width:42px; height:42px;
    background:#fff;
    border-radius:13px;
    display:flex; align-items:center; justify-content:center;
    flex:none;
    box-shadow:0 2px 0 rgba(0,0,0,0.06);
  }
  .card-text{ flex:1; }
  .card-text h2{
    font-family:'Baloo 2', sans-serif;
    font-size:16px;
    margin:0;
  }
  .card-text span{
    display:block;
    font-size:12px;
    color:#8a7a7a;
    font-weight:600;
  }
  .card-arrow{ color:#bbb; font-size:16px; flex:none; }

  .file-list{ display:grid; gap:8px; margin-top:4px; }
  .file-item{
    display:flex;
    align-items:center;
    gap:10px;
    background:#fff;
    border-radius:14px;
    padding:11px 13px;
    text-decoration:none;
    color:var(--ink);
    font-size:14.5px;
    font-weight:600;
    box-shadow:var(--shadow);
    border:2px solid #eee6de;
    transition:transform .12s ease;
  }
  .file-item:hover{ transform:translateX(3px); }
  .file-item .fi-icon{ font-size:18px; flex:none; }
  .file-item .fi-meta{
    margin-left:auto;
    font-size:11px;
    font-weight:600;
    color:#a99;
    white-space:nowrap;
  }

  .pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-top:14px;
  }
  .page-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    border:none;
    background:#f1eee8;
    color:#6b5b5b;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
  }
  .page-btn:disabled{ opacity:0.4; cursor:default; }
  .page-label{
    font-family:'Baloo 2', sans-serif;
    font-size:13px;
    color:#8a7a7a;
  }

  .error-box{
    background:#fff;
    border:2px solid #f3c7c2;
    border-radius:18px;
    padding:16px;
    text-align:center;
    color:#a83f34;
    font-size:14px;
    margin-top:20px;
  }

  footer{
    text-align:center;
    margin:26px 0 6px;
    font-family:'Baloo 2', sans-serif;
    color:var(--purple);
    font-weight:700;
    font-size:14px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Bank Soal Interaktif</div>
    <h1>📚 Belajar Anak</h1>
    <p>Pilih nama anak / folder umum → pilih soal yang ingin dikerjakan.</p>
  </header>

  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="status" class="status">Memuat...</div>
  <div id="content"></div>

  <footer>🌟 Belajar dengan semangat, prestasi pun akan hebat! 🌟</footer>
</div>

<script>
const PAGE_SIZE = 5;

const COLOR_PALETTE = [
  {border:'#ffe3a3', bg:'#fff3d6'},
  {border:'#ffe3ec', bg:'#ffe3ec'},
  {border:'#d8f5e6', bg:'#d8f5e6'},
  {border:'#e1f0ff', bg:'#e1f0ff'},
  {border:'#ece5fb', bg:'#ece5fb'},
];
const ICON_ANAK = ['🧒','👧'];
const ICON_KELAS = ['🏷️','📁','📂','🗂️'];
const ICON_MAPEL = ['📘','🔢','🌍','🎵','🎨','🏃','🔤','🧪','🌱','⭐'];

// Tema personal (Umum sudah ditambahkan di sini)
const ANAK_THEME = {
  'Maisun': { icon: '🦄', color: { border:'#ffb3c8', bg:'#ffe3ec' } },
  'Uwais':  { icon: '🥷', color: { border:'#ff8a80', bg:'#ffe0dc' } },
  'Umum':   { icon: '📁', color: { border:'#b2dfdb', bg:'#e0f2f1' } }
};

function colorFor(name){
  let hash = 0;
  for(let i=0;i<name.length;i++) hash = name.charCodeAt(i) + ((hash<<5)-hash);
  return { hash: Math.abs(hash), color: COLOR_PALETTE[Math.abs(hash) % COLOR_PALETTE.length] };
}
function iconFor(name, palette){
  const { hash } = colorFor(name);
  return palette[hash % palette.length];
}

function niceName(filename){
  return filename
    .replace(/\.html$/i, '')
    .replace(/[-_]/g, ' ')
    .replace(/\b\w/g, c => c.toUpperCase());
}

function formatDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' });
}

let TREE = {}; 
let currentPath = []; 
let currentPage = 1;
let currentFiles = [];

async function loadTree(){
  const statusEl = document.getElementById('status');
  statusEl.style.display = 'block';
  statusEl.textContent = 'Memuat...';
  document.getElementById('content').innerHTML = '';
  try{
    const res = await fetch(`manifest.json?t=${Date.now()}`);
    if(!res.ok) throw new Error('manifest.json belum tersedia (status ' + res.status + ')');
    const data = await res.json();
    TREE = data.tree || {};

    statusEl.style.display = 'none';
    render();
  } catch(err){
    statusEl.textContent = '';
    document.getElementById('content').innerHTML = `
      <div class="error-box">
        ⚠️ Tidak bisa memuat daftar soal.<br>${err.message}
        <br><br>Kalau ini baru pertama kali setup, tunggu 1-2 menit sampai GitHub Actions selesai membuat manifest.json, lalu coba lagi.
        <br><br>
        <button class="page-btn" onclick="loadTree()">🔄 Coba Lagi</button>
      </div>`;
  }
}

function getNode(path){
  let node = TREE;
  for(const seg of path) node = node?.[seg];
  return node;
}

function renderBreadcrumb(){
  const el = document.getElementById('breadcrumb');
  const labels = ['🏠 Beranda', ...currentPath];
  el.innerHTML = labels.map((label, i) => {
    const isLast = i === labels.length - 1;
    const depth = i; 
    return `${i>0 ? '<span class="crumb-sep">/</span>' : ''}<span class="crumb ${isLast?'current':''}" onclick="goTo(${depth})">${label}</span>`;
  }).join('');
}

function goTo(depth){
  currentPath = currentPath.slice(0, depth);
  render();
}

function goInto(name){
  currentPath = [...currentPath, name];
  render();
}

async function render(){
  renderBreadcrumb();
  const contentEl = document.getElementById('content');
  const node = getNode(currentPath);

  if(!node){
    contentEl.innerHTML = `<div class="error-box">Folder tidak ditemukan.</div>`;
    return;
  }

  // JIKA YANG DIKLIK ADALAH KUMPULAN FILE (Array)
  if(Array.isArray(node)){
    const sorted = [...node].sort((a,b) => {
      if(!a.date && !b.date) return a.filename.localeCompare(b.filename);
      if(!a.date) return 1;
      if(!b.date) return -1;
      return new Date(b.date) - new Date(a.date);
    });
    currentFiles = sorted;
    currentPage = 1;
    renderFilePage();
    return;
  }

  // Pengaturan agar Umum tampil pertama, dan pengurutan abjad untuk lainnya
  const keys = Object.keys(node).sort((a, b) => {
    if (a === 'Umum') return -1;
    if (b === 'Umum') return 1;
    return a.localeCompare(b);
  });

  const depth = currentPath.length; // 0=akar utama, 1=anak/umum, dst
  const iconPalette = depth === 0 ? ICON_ANAK : depth === 1 ? ICON_KELAS : ICON_MAPEL;

  const cards = keys.map(key => {
    const child = node[key];
    let subtitle;
    
    // Penyesuaian agar mendeteksi jika langsung berisi file
    if(Array.isArray(child)){
      subtitle = `${child.length} soal`;
    } else {
      const count = Object.keys(child).length;
      subtitle = `${count} item tersedia`;
    }

    let color, icon;
    if(depth === 0 && ANAK_THEME[key]){
      color = ANAK_THEME[key].color;
      icon = ANAK_THEME[key].icon;
    } else {
      color = colorFor(key).color;
      icon = iconFor(key, iconPalette);
    }

    return `
      <div class="card" style="border-color:${color.border}; background:${color.bg}" onclick="goInto('${key.replace(/'/g,"\\'")}')">
        <div class="card-icon">${icon}</div>
        <div class="card-text">
          <h2>${key}</h2>
          <span>${subtitle}</span>
        </div>
        <div class="card-arrow">›</div>
      </div>
    `;
  }).join('');

  if(keys.length === 0){
    contentEl.innerHTML = `<div class="status">Folder ini masih kosong.</div>`;
  } else {
    contentEl.innerHTML = `<div class="grid cards">${cards}</div>`;
  }
}

function renderFilePage(){
  const contentEl = document.getElementById('content');
  const totalPages = Math.max(1, Math.ceil(currentFiles.length / PAGE_SIZE));
  if(currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = currentFiles.slice(start, start + PAGE_SIZE);

  const fileItems = pageItems.map(it => `
    <a class="file-item" href="${encodeURI(it.path)}">
      <span class="fi-icon">📝</span>
      <span>${niceName(it.filename)}</span>
      <span class="fi-meta">${formatDate(it.date)}</span>
    </a>
  `).join('');

  const paginationHtml = currentFiles.length > PAGE_SIZE ? `
    <div class="pagination">
      <button class="page-btn" onclick="changePage(-1)" ${currentPage<=1 ? 'disabled':''}>‹ Sebelumnya</button>
      <span class="page-label">Halaman ${currentPage} / ${totalPages}</span>
      <button class="page-btn" onclick="changePage(1)" ${currentPage>=totalPages ? 'disabled':''}>Selanjutnya ›</button>
    </div>
  ` : '';

  const listOrEmpty = currentFiles.length === 0
    ? `<div class="status">Belum ada soal di mata pelajaran ini.</div>`
    : `<div class="file-list">${fileItems}</div>${paginationHtml}`;

  contentEl.innerHTML = listOrEmpty;
}

function changePage(dir){
  currentPage += dir;
  renderFilePage();
}

loadTree();
</script>
</body>
</html>
